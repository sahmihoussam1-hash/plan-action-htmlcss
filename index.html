<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product preview card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="product-card">
        <img src="plan-action-htmlcss/images/src/Capture d'écran 2026-11-14 165711.png" alt="Gabrielle Essence Eau De Parfum" class="product-image">
        <div class="product-content">
            <span class="category">PERFUME</span>
            <h1>Gabrielle Essence Eau De Parfum</h1>
            <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of Chanel.</p>
            <div class="price-container">
                <span class="current-price">$149.99</span>
                <span class="original-price">$169.99</span>
            </div>
            <button class="add-btn">Add to Cart</button>
        </div>
    </div>
</body>
</html>
