<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composant de résumé des résultats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="results-card">
        <div class="result-section">
            <h2>Votre Résultat</h2>
            <div class="circle-score">
                <span class="score">76</span>
                <span class="total">sur 100</span>
            </div>
            <h3>Excellent</h3>
            <p>Vous avez obtenu un score supérieur à 65 % des personnes ayant passé ces tests.</p>
        </div>
        <div class="summary-section">
            <h2>Résumé</h2>
            <div class="summary-item reaction">
                <span class="category-name">Réaction</span>
                <span class="category-score">80 <span class="max">/ 100</span></span>
            </div>
            <div class="summary-item memory">
                <span class="category-name">Mémoire</span>
                <span class="category-score">92 <span class="max">/ 100</span></span>
            </div>
            <div class="summary-item verbal">
                <span class="category-name">Verbal</span>
                <span class="category-score">61 <span class="max">/ 100</span></span>
            </div>
            <div class="summary-item visual">
                <span class="category-name">Visuel</span>
                <span class="category-score">72 <span class="max">/ 100</span></span>
            </div>
            <button class="continue-btn">Continuer</button>
        </div>
    </div>
</body>
</html>
